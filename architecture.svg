<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'JetBrains Mono','Consolas',monospace">
  <defs>
    <linearGradient id="bobgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82ff"/>
      <stop offset="1" stop-color="#0f62fe"/>
    </linearGradient>
    <filter id="bobglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a5a6a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f62fe"/>
    </marker>
    <marker id="arrSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3ddc84"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#0b0f14"/>

  <!-- title -->
  <text x="40" y="52" fill="#e6edf3" font-size="26" font-weight="700" font-family="'Fraunces',Georgia,serif">TriageGate</text>
  <text x="40" y="76" fill="#7d8c9c" font-size="13">Restraint as a feature — only ambiguous tickets reach the agent</text>

  <!-- ticket -->
  <rect x="40" y="110" width="150" height="58" rx="9" fill="#111821" stroke="#1e2a36"/>
  <text x="115" y="136" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">Bug ticket</text>
  <text x="115" y="154" fill="#7d8c9c" font-size="11" text-anchor="middle">title + description</text>

  <!-- ladder container -->
  <rect x="40" y="200" width="360" height="330" rx="12" fill="#0e141b" stroke="#1e2a36"/>
  <text x="60" y="228" fill="#3ddc84" font-size="11" letter-spacing="3">DETERMINISTIC LADDER</text>

  <!-- rung 1 -->
  <rect x="60" y="244" width="320" height="52" rx="8" fill="#111821" stroke="#1f6b45"/>
  <text x="74" y="266" fill="#3ddc84" font-size="12" font-weight="700">RUNG 1 · svm_gate</text>
  <text x="74" y="285" fill="#7d8c9c" font-size="11">SVM confidence ≥ 0.55 → route instantly</text>

  <!-- rung 2 -->
  <rect x="60" y="306" width="320" height="52" rx="8" fill="#111821" stroke="#1f6b45"/>
  <text x="74" y="328" fill="#3ddc84" font-size="12" font-weight="700">RUNG 2 · voter_agreement</text>
  <text x="74" y="347" fill="#7d8c9c" font-size="11">≥2 of 3 voters agree + scorer evidence</text>

  <!-- rung 2.5 -->
  <rect x="60" y="368" width="320" height="52" rx="8" fill="#111821" stroke="#1f6b45"/>
  <text x="74" y="390" fill="#3ddc84" font-size="12" font-weight="700">RUNG 2.5 · granite_tiebreak</text>
  <text x="74" y="409" fill="#7d8c9c" font-size="11">watsonx.ai Granite — breaks ties only</text>

  <!-- rung 3 -->
  <rect x="60" y="430" width="320" height="52" rx="8" fill="#1a1206" stroke="#8a5a1a"/>
  <text x="74" y="452" fill="#ffb454" font-size="12" font-weight="700">RUNG 3 · escalate</text>
  <text x="74" y="471" fill="#a98a5a" font-size="11">no confident route → hand to the agent</text>

  <!-- voters caption -->
  <text x="60" y="508" fill="#4a5a6a" font-size="10.5">voters: DeterministicScorer · SVM (TF-IDF) · kNN (k=5, retrieval)</text>

  <!-- ticket -> ladder -->
  <path d="M115 168 L115 200" stroke="#4a5a6a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- escalate -> BOB (bold blue) -->
  <path d="M380 456 L470 456 L470 300 L560 300" stroke="#0f62fe" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/>
  <text x="470" y="486" fill="#5b8dff" font-size="10.5" text-anchor="middle">dispatch</text>

  <!-- ============ BOB — bold central node ============ -->
  <rect x="560" y="212" width="250" height="176" rx="18" fill="url(#bobgrad)" stroke="#89b4ff" stroke-width="2.5" filter="url(#bobglow)"/>
  <text x="685" y="258" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle" font-family="'Fraunces',Georgia,serif">IBM Bob</text>
  <text x="685" y="282" fill="#dbe7ff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">2.0 · Bug Investigator</text>
  <line x1="590" y1="300" x2="780" y2="300" stroke="#89b4ff" stroke-width="1" opacity="0.5"/>
  <text x="685" y="322" fill="#eaf1ff" font-size="11.5" text-anchor="middle">headless: bob run --mode bug-investigator</text>
  <text x="685" y="344" fill="#eaf1ff" font-size="11.5" text-anchor="middle">reads repo · baseline tests · classifies risk</text>
  <text x="685" y="366" fill="#eaf1ff" font-size="11.5" text-anchor="middle">proposes minimal patch</text>

  <!-- BOB -> risk split -->
  <path d="M685 388 L685 420" stroke="#0f62fe" stroke-width="2.4" fill="none" marker-end="url(#arrBlue)"/>

  <!-- risk diamond -->
  <path d="M685 420 L740 452 L685 484 L630 452 z" fill="#1a1206" stroke="#8a5a1a" stroke-width="1.6"/>
  <text x="685" y="456" fill="#ffb454" font-size="12" font-weight="700" text-anchor="middle">risk?</text>

  <!-- LOW path -->
  <path d="M630 452 L500 452 L500 560 L560 560" stroke="#3ddc84" stroke-width="1.8" fill="none" marker-end="url(#arrSig)"/>
  <text x="520" y="444" fill="#3ddc84" font-size="11" font-weight="700">LOW</text>
  <rect x="560" y="536" width="230" height="48" rx="8" fill="#0e1a12" stroke="#1f6b45"/>
  <text x="675" y="558" fill="#3ddc84" font-size="12" font-weight="700" text-anchor="middle">auto-apply patch</text>
  <text x="675" y="575" fill="#7d8c9c" font-size="10.5" text-anchor="middle">run tests · post completed report</text>

  <!-- HIGH path -->
  <path d="M740 452 L860 452 L860 500 L830 500" stroke="#ff5d5d" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="800" y="444" fill="#ff5d5d" font-size="11" font-weight="700">HIGH</text>

  <!-- console approval (signature element) -->
  <rect x="600" y="500" width="360" height="96" rx="12" fill="#140b0b" stroke="#7a2020" stroke-width="1.6"/>
  <text x="620" y="524" fill="#ff8a8a" font-size="11" letter-spacing="2">HUMAN-IN-THE-LOOP · TRIAGEGATE CONSOLE</text>
  <text x="620" y="548" fill="#e6edf3" font-size="12">Bob posts pending proposal → blocks on</text>
  <text x="620" y="566" fill="#e6edf3" font-size="12">wait_for_approval.py</text>
  <text x="620" y="586" fill="#ffb454" font-size="12" font-weight="700">operator clicks Approve — then patch applies</text>

  <!-- HIGH -> approval -->
  <path d="M830 500 L830 500" stroke="#ff5d5d" stroke-width="1.8" fill="none"/>

  <!-- completed -> history -->
  <rect x="560" y="624" width="400" height="56" rx="10" fill="#0e1a12" stroke="#1f6b45"/>
  <text x="760" y="648" fill="#3ddc84" font-size="13" font-weight="700" text-anchor="middle">✓ Fix verified · 32 + 1 failed → 33 passed</text>
  <text x="760" y="668" fill="#7d8c9c" font-size="11" text-anchor="middle">verified diff · recorded to incident history</text>

  <!-- low/approval -> completed -->
  <path d="M675 584 L675 604 L760 604 L760 624" stroke="#3ddc84" stroke-width="1.6" fill="none" marker-end="url(#arrSig)"/>
  <path d="M780 596 L780 624" stroke="#ffb454" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
</svg>
