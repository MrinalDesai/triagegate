<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" font-family="'JetBrains Mono','Consolas',monospace">
  <defs>
    <linearGradient id="bobgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82ff"/>
      <stop offset="1" stop-color="#0f62fe"/>
    </linearGradient>
    <filter id="bobglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a5a6a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f62fe"/>
    </marker>
    <marker id="arrSig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3ddc84"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff5d5d"/>
    </marker>
  </defs>

  <rect width="1040" height="780" fill="#0b0f14"/>

  <text x="40" y="50" fill="#e6edf3" font-size="26" font-weight="700" font-family="'Fraunces',Georgia,serif">TriageGate</text>
  <text x="40" y="74" fill="#7d8c9c" font-size="13">Restraint as a feature &#8212; only ambiguous tickets reach the agent</text>

  <rect x="40" y="110" width="150" height="56" rx="9" fill="#111821" stroke="#1e2a36"/>
  <text x="115" y="135" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">Bug ticket</text>
  <text x="115" y="153" fill="#7d8c9c" font-size="11" text-anchor="middle">title + description</text>
  <path d="M115 166 L115 196" stroke="#4a5a6a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <rect x="40" y="196" width="360" height="360" rx="12" fill="#0e141b" stroke="#1e2a36"/>
  <text x="60" y="224" fill="#3ddc84" font-size="11" letter-spacing="3">DETERMINISTIC LADDER</text>

  <rect x="60" y="238" width="320" height="54" rx="8" fill="#111821" stroke="#1f6b45"/>
  <text x="74" y="261" fill="#3ddc84" font-size="12" font-weight="700">RUNG 1 &#183; svm_gate</text>
  <text x="74" y="280" fill="#7d8c9c" font-size="11">SVM confidence &#8805; 0.55 &#8594; route instantly</text>

  <rect x="60" y="302" width="320" height="54" rx="8" fill="#111821" stroke="#1f6b45"/>
  <text x="74" y="325" fill="#3ddc84" font-size="12" font-weight="700">RUNG 2 &#183; voter_agreement</text>
  <text x="74" y="344" fill="#7d8c9c" font-size="11">&#8805;2 of 3 voters agree + scorer evidence</text>

  <rect x="60" y="366" width="320" height="54" rx="8" fill="#111821" stroke="#1f6b45"/>
  <text x="74" y="389" fill="#3ddc84" font-size="12" font-weight="700">RUNG 2.5 &#183; granite_tiebreak</text>
  <text x="74" y="408" fill="#7d8c9c" font-size="11">watsonx.ai Granite &#8212; breaks ties only</text>

  <rect x="60" y="430" width="320" height="54" rx="8" fill="#1a1206" stroke="#8a5a1a"/>
  <text x="74" y="453" fill="#ffb454" font-size="12" font-weight="700">RUNG 3 &#183; escalate</text>
  <text x="74" y="472" fill="#a98a5a" font-size="11">no confident route &#8594; hand to the agent</text>

  <text x="60" y="512" fill="#4a5a6a" font-size="10.5">3 voters: DeterministicScorer &#183; SVM (TF-IDF)</text>
  <text x="60" y="530" fill="#4a5a6a" font-size="10.5">&#183; kNN (k=5, incident retrieval)</text>

  <path d="M380 457 L500 457 L500 300 L610 300" stroke="#0f62fe" stroke-width="3" fill="none" marker-end="url(#arrBlue)"/>
  <text x="505" y="330" fill="#5b8dff" font-size="10.5">dispatch</text>

  <rect x="610" y="216" width="290" height="168" rx="18" fill="url(#bobgrad)" stroke="#89b4ff" stroke-width="2.5" filter="url(#bobglow)"/>
  <text x="755" y="262" fill="#ffffff" font-size="30" font-weight="800" text-anchor="middle" font-family="'Fraunces',Georgia,serif">IBM Bob</text>
  <text x="755" y="285" fill="#dbe7ff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">2.0 &#183; Bug Investigator mode</text>
  <line x1="640" y1="302" x2="870" y2="302" stroke="#89b4ff" stroke-width="1" opacity="0.5"/>
  <text x="755" y="324" fill="#eaf1ff" font-size="11" text-anchor="middle">headless: bob run --mode bug-investigator</text>
  <text x="755" y="344" fill="#eaf1ff" font-size="11" text-anchor="middle">reads repo &#183; baseline tests &#183; classifies risk</text>
  <text x="755" y="364" fill="#eaf1ff" font-size="11" text-anchor="middle">proposes a minimal patch</text>

  <path d="M755 384 L755 410" stroke="#0f62fe" stroke-width="2.4" fill="none" marker-end="url(#arrBlue)"/>

  <path d="M755 410 L808 448 L755 486 L702 448 z" fill="#1a1206" stroke="#8a5a1a" stroke-width="1.6"/>
  <text x="755" y="453" fill="#ffb454" font-size="13" font-weight="700" text-anchor="middle">risk?</text>

  <path d="M702 448 L560 448 L560 540" stroke="#3ddc84" stroke-width="1.8" fill="none" marker-end="url(#arrSig)"/>
  <text x="612" y="440" fill="#3ddc84" font-size="11" font-weight="700">LOW</text>
  <rect x="440" y="540" width="240" height="56" rx="9" fill="#0e1a12" stroke="#1f6b45"/>
  <text x="560" y="564" fill="#3ddc84" font-size="12" font-weight="700" text-anchor="middle">auto-apply patch</text>
  <text x="560" y="582" fill="#7d8c9c" font-size="10.5" text-anchor="middle">run tests &#183; post completed report</text>

  <path d="M808 448 L920 448 L920 540" stroke="#ff5d5d" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
  <text x="852" y="440" fill="#ff5d5d" font-size="11" font-weight="700">HIGH</text>
  <rect x="720" y="540" width="290" height="110" rx="12" fill="#140b0b" stroke="#7a2020" stroke-width="1.6"/>
  <text x="740" y="564" fill="#ff8a8a" font-size="10.5" letter-spacing="1.5">HUMAN-IN-THE-LOOP &#183; CONSOLE</text>
  <text x="740" y="588" fill="#e6edf3" font-size="11.5">Bob posts pending proposal, then</text>
  <text x="740" y="606" fill="#e6edf3" font-size="11.5">blocks on wait_for_approval.py</text>
  <text x="740" y="628" fill="#ffb454" font-size="11.5" font-weight="700">operator clicks Approve &#8594;</text>
  <text x="740" y="644" fill="#ffb454" font-size="11.5" font-weight="700">patch applies</text>

  <rect x="360" y="690" width="440" height="58" rx="10" fill="#0e1a12" stroke="#1f6b45"/>
  <text x="580" y="715" fill="#3ddc84" font-size="13" font-weight="700" text-anchor="middle">&#10003; Fix verified &#183; 32 + 1 failed &#8594; 33 passed</text>
  <text x="580" y="735" fill="#7d8c9c" font-size="11" text-anchor="middle">verified diff &#183; recorded to incident history</text>

  <path d="M560 596 L560 660 L520 660 L520 690" stroke="#3ddc84" stroke-width="1.6" fill="none" marker-end="url(#arrSig)"/>
  <path d="M865 650 L865 668 L640 668 L640 690" stroke="#ffb454" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
</svg>
