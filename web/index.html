<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriageGate — Console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header">
  <span class="logo">TriageGate</span>
  <span class="badge">IBM Bob 2.0 + watsonx</span>
</div>

<nav>
  <a href="index.html" class="active">Console</a>
  <a href="stats.html">Ladder Stats</a>
  <a href="about.html">About</a>
</nav>

<main>
  <!-- Submit form -->
  <div class="card">
    <div class="card-title">Route a Ticket</div>
    <form id="ticket-form">
      <label for="ticket-id">Ticket ID</label>
      <input type="text" id="ticket-id" placeholder="e.g. T-100" required>

      <label for="ticket-title">Title</label>
      <input type="text" id="ticket-title" placeholder="Short summary of the issue" required>

      <label for="ticket-desc">Description</label>
      <textarea id="ticket-desc" placeholder="Full description…" required></textarea>

      <button type="submit" id="submit-btn">Route Ticket</button>
    </form>
  </div>

  <!-- Result area (hidden until response) -->
  <div id="result-area" class="hidden">

    <!-- Ladder visualization -->
    <div class="card" id="ladder-card">
      <div class="card-title">Resolution Ladder</div>
      <div class="ladder" id="ladder"></div>
    </div>

    <!-- Per-voter breakdown -->
    <div class="card" id="voters-card">
      <div class="card-title">Voter Breakdown</div>
      <table>
        <thead>
          <tr>
            <th>Voter</th>
            <th>Domain</th>
            <th>Confidence</th>
          </tr>
        </thead>
        <tbody id="voters-tbody"></tbody>
      </table>
    </div>

    <!-- Evidence -->
    <div class="card" id="evidence-card">
      <div class="card-title">Evidence Terms</div>
      <div class="chip-row" id="evidence-chips"></div>
    </div>

    <!-- Timing -->
    <div id="elapsed-row" class="elapsed mt-8"></div>

    <!-- Bob Escalation panel (only when domain === "escalated") -->
    <div class="card hidden" id="escalation-card">
      <div class="card-title">Bob Investigator Report</div>
      <div id="escalation-inner">
        <span class="spinner"></span> Loading investigation…
      </div>
    </div>

  </div><!-- /result-area -->
</main>

<script src="app.js"></script>
<script>
// ── Ladder rung definitions ──────────────────────────────────────────────────
const RUNGS = [
  { id: 'svm_gate',        label: 'SVM Gate' },
  { id: 'voter_agreement', label: 'Voter Agreement' },
  { id: 'escalate',        label: 'Bob Investigator' },
  { id: 'human',           label: 'Human' },
];

// resolved_by values from the API
const RUNG_IDS = RUNGS.map(r => r.id);

/**
 * Build the ladder DOM.
 * resolvedBy  – which rung resolved the ticket (or null while loading)
 * isEscalated – true when domain === 'escalated' (Bob glows amber instead of cyan)
 */
function buildLadder(resolvedBy, isEscalated) {
  const container = document.getElementById('ladder');
  container.innerHTML = '';

  // Determine which rungs were passed through and which was the resolution rung
  const resolvedIdx = RUNG_IDS.indexOf(resolvedBy);

  RUNGS.forEach((rung, i) => {
    // ── vertical connector before this rung (except first) ──
    if (i > 0) {
      const vline = document.createElement('div');
      vline.className = 'rung-vline' + (i <= resolvedIdx ? ' active' : '');
      container.appendChild(vline);
    }

    const row = document.createElement('div');
    row.className = 'rung-row';

    // Node
    const node = document.createElement('div');
    node.className = 'rung-node';
    node.textContent = rung.label;

    if (resolvedBy === null) {
      // still loading — neutral
    } else if (i < resolvedIdx) {
      node.classList.add('passed');
    } else if (i === resolvedIdx) {
      if (isEscalated && rung.id === 'escalate') {
        node.classList.add('escalated');
      } else {
        node.classList.add('resolved');
      }
    }
    // rungs after resolvedIdx stay outlined (default)

    // Horizontal connector
    const conn = document.createElement('div');
    conn.className = 'rung-connector' + (i < resolvedIdx ? ' passed' : (i === resolvedIdx ? ' active' : ''));

    // Status label
    const status = document.createElement('div');
    status.className = 'rung-status';
    if (resolvedBy !== null) {
      if (i < resolvedIdx) status.textContent = 'passed';
      else if (i === resolvedIdx) status.textContent = isEscalated && rung.id === 'escalate' ? 'escalated' : 'resolved ✓';
      else status.textContent = '—';
    }

    row.appendChild(node);
    row.appendChild(conn);
    row.appendChild(status);
    container.appendChild(row);
  });
}

// ── Voters table ──────────────────────────────────────────────────────────────
function buildVoters(voters) {
  const tbody = document.getElementById('voters-tbody');
  tbody.innerHTML = '';
  voters.forEach(v => {
    const pct = Math.round(v.confidence * 100);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(v.voter)}</td>
      <td>${esc(v.domain)}</td>
      <td>
        <div class="conf-bar-wrap">
          <div class="conf-bar"><div class="conf-bar-fill" style="width:${pct}%"></div></div>
          <span class="conf-val">${pct}%</span>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

// ── Evidence chips ────────────────────────────────────────────────────────────
function buildEvidence(evidence) {
  const row = document.getElementById('evidence-chips');
  row.innerHTML = '';
  if (!evidence || evidence.length === 0) {
    row.textContent = 'No evidence terms matched.';
    return;
  }
  evidence.forEach(term => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = term;
    row.appendChild(chip);
  });
}

// ── Escalation panel ─────────────────────────────────────────────────────────
async function loadEscalation(ticketId) {
  const card = document.getElementById('escalation-card');
  const inner = document.getElementById('escalation-inner');
  card.classList.remove('hidden');

  try {
    const resp = await fetch(`/api/escalations/${encodeURIComponent(ticketId)}`);
    if (resp.status === 404) {
      inner.innerHTML = '<span style="color:var(--text-muted)">Investigation pending — no report filed yet.</span>';
      return;
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const r = await resp.json();

    const verdictClass = { fix_verified: 'fix-verified', fix_failed: 'fix-failed', needs_human: 'needs-human' }[r.verdict] || 'needs-human';
    const verdictLabel = { fix_verified: '✓ FIX VERIFIED', fix_failed: '✗ FIX FAILED', needs_human: '⚠ NEEDS HUMAN' }[r.verdict] || r.verdict;

    inner.innerHTML = `
      <div class="mt-8" style="margin-bottom:16px">
        <span class="verdict-badge ${verdictClass}">${verdictLabel}</span>
      </div>

      <div class="card-title mt-16">Root Cause</div>
      <p style="margin-bottom:16px">${esc(r.root_cause)}</p>

      <div class="card-title">Patch Summary</div>
      <p style="margin-bottom:16px">${esc(r.patch_summary)}</p>

      <div class="card-title">Files Examined</div>
      <div class="chip-row" style="margin-bottom:16px">
        ${r.files_examined.map(f => `<span class="chip">${esc(f)}</span>`).join('')}
      </div>

      <div class="card-title">Diff</div>
      <pre id="diff-block" style="margin-bottom:16px"></pre>

      <div class="card-title">Test Results</div>
      <div class="tests-grid">
        <div class="tests-block"><label>Before</label><code>${esc(r.tests_before)}</code></div>
        <div class="tests-block"><label>After</label><code>${esc(r.tests_after)}</code></div>
      </div>
    `;
    renderDiff(document.getElementById('diff-block'), r.diff);
  } catch (e) {
    inner.innerHTML = `<span style="color:var(--red)">Error loading report: ${esc(String(e))}</span>`;
  }
}

// ── Form submit ───────────────────────────────────────────────────────────────
document.getElementById('ticket-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const id    = document.getElementById('ticket-id').value.trim();
  const title = document.getElementById('ticket-title').value.trim();
  const desc  = document.getElementById('ticket-desc').value.trim();

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Routing…';

  // Reset result area
  document.getElementById('result-area').classList.add('hidden');
  document.getElementById('escalation-card').classList.add('hidden');

  try {
    const resp = await fetch('/api/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, title, description: desc }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      throw new Error(err.detail || resp.statusText);
    }
    const data = await resp.json();

    // Show result area
    document.getElementById('result-area').classList.remove('hidden');

    // Build ladder
    const isEscalated = data.domain === 'escalated';
    buildLadder(data.resolved_by, isEscalated);

    // Voters
    buildVoters(data.voters);

    // Evidence
    buildEvidence(data.evidence);

    // Elapsed
    document.getElementById('elapsed-row').textContent = `Elapsed: ${data.elapsed_ms} ms`;

    // Escalation panel if needed
    if (isEscalated) {
      loadEscalation(data.ticket_id);
    }

  } catch (err) {
    document.getElementById('result-area').classList.remove('hidden');
    document.getElementById('ladder-card').innerHTML =
      `<div class="card-title">Error</div><p style="color:var(--red)">${esc(String(err))}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Route Ticket';
  }
});
</script>
</body>
</html>
