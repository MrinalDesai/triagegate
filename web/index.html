<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TriageGate — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header">
  <span class="logo">Triage<em>Gate</em></span>
  <span class="badge">IBM Bob 2.0 + watsonx</span>
</div>

<nav>
  <a href="index.html" class="active">Console</a>
  <a href="stats.html">Ladder Stats</a>
  <a href="about.html">About</a>
</nav>

<main>
  <!-- Submit form -->
  <div class="card">
    <div class="card-title">Route a Ticket</div>
    <form id="ticket-form">
      <label for="ticket-id">Ticket ID</label>
      <input type="text" id="ticket-id" placeholder="e.g. T-100" required>

      <label for="ticket-title">Title</label>
      <input type="text" id="ticket-title" placeholder="Short summary of the issue" required>

      <label for="ticket-desc">Description</label>
      <textarea id="ticket-desc" placeholder="Full description…" required></textarea>

      <button type="submit" id="submit-btn">▶ Route Ticket</button>
    </form>
  </div>

  <!-- Result area (hidden until response) -->
  <div id="result-area" class="hidden">

    <!-- Two-column layout: main content left, pipeline path right -->
    <div class="result-layout">

      <!-- Left column: voters, evidence, timing, escalation -->
      <div class="result-main">

        <!-- Per-voter breakdown -->
        <div class="card" id="voters-card">
          <div class="card-title">Voter Breakdown</div>
          <table>
            <thead>
              <tr>
                <th>Voter</th>
                <th>Domain</th>
                <th>Confidence</th>
              </tr>
            </thead>
            <tbody id="voters-tbody"></tbody>
          </table>
        </div>

        <!-- Evidence -->
        <div class="card" id="evidence-card">
          <div class="card-title">Evidence Terms</div>
          <div class="chip-row" id="evidence-chips"></div>
        </div>

        <!-- Timing -->
        <div id="elapsed-row" class="elapsed mt-8"></div>

        <!-- Bob Escalation panel (only when domain === "escalated") -->
        <div class="card hidden" id="escalation-card">
          <div class="card-title">Bob Investigator Report</div>
          <div id="escalation-inner">
            <span class="spinner"></span> Loading investigation…
          </div>
        </div>

      </div><!-- /result-main -->

      <!-- Right column: Pipeline path card (sticky) -->
      <div class="result-aside">
        <div class="pipeline-card" id="pipeline-card">
          <div class="pipeline-title">Pipeline path</div>
          <div class="pipeline-hint">Lights up the exact route this ticket took.</div>
          <div class="pipeline-spine" id="pipeline-spine">
            <!-- Populated by buildPipeline() -->
          </div>
        </div>
      </div><!-- /result-aside -->

    </div><!-- /result-layout -->

  </div><!-- /result-area -->
</main>

<script src="app.js"></script>
<script>
// ── Pipeline node definitions ─────────────────────────────────────────────────
//
//  Spine order: Ticket → SVM gate → Voters → Granite tiebreak →
//               Bob Investigator → Resolved
//
//  Side-branch "route" pills connect horizontally from SVM gate and Voters.
//  They light when that stage is where the ticket was resolved.
//
// Node IDs used internally:
const PIPELINE_NODES = [
  { id: 'ticket',    label: 'Ticket',            hasBranch: false },
  { id: 'svm_gate',  label: 'SVM gate',           hasBranch: true  },
  { id: 'voters',    label: 'Voters',             hasBranch: true  },
  { id: 'granite',   label: 'Granite tiebreak',   hasBranch: false },
  { id: 'bob',       label: 'Bob Investigator',   hasBranch: false },
  { id: 'resolved',  label: 'Resolved',           hasBranch: false },
];

/**
 * Build (or rebuild) the pipeline-spine DOM.
 *
 * @param {string|null} resolvedBy  — "svm_gate" | "voter_agreement" | "escalate" | null
 * @param {boolean}     isEscalated — true when domain === "escalated"
 * @param {boolean}     escalationSettled — true once Bob report has loaded
 * @param {string|null} verdict     — "fix_verified" | "fix_failed" | "needs_human" | null
 */
function buildPipeline(resolvedBy, isEscalated, escalationSettled, verdict) {
  const spine = document.getElementById('pipeline-spine');
  spine.innerHTML = '';

  // Determine which nodes are traversed / lit / dark
  // and which branch pills light.
  //
  // State buckets for spine nodes (by id):
  //   pp-lit       : on the taken path, full green
  //   pp-traversed : passed through en-route (dim-green)
  //   pp-dark      : never reached (dim, no fill)
  //   pp-resolved  : the Resolved terminal node (green)
  //   pp-escalating: Bob Investigator while pulsing
  //   pp-escalated : Bob Investigator after report loads
  //   pp-resolved-failed / pp-resolved-human : Resolved node variants
  //
  // Branch pills (svm_gate, voters):
  //   pp-lit   : route was resolved at this stage (route pill lights green)
  //   (default): dim / invisible-ish

  const nodeStates = {};   // id → class string for .pp-node
  const vlineStates = {};  // index → class string for the vline ABOVE that node
  const branchStates = {}; // id → class string for branch pill + branch line

  // Default everything to dark
  PIPELINE_NODES.forEach(n => { nodeStates[n.id] = 'pp-dark'; });
  for (let i = 1; i < PIPELINE_NODES.length; i++) {
    vlineStates[i] = '';   // empty = default --line color
  }

  if (resolvedBy !== null) {
    // Ticket is always lit (starting node)
    nodeStates['ticket'] = 'pp-lit';
    vlineStates[1] = 'pp-lit'; // Ticket → SVM gate line

    if (resolvedBy === 'svm_gate') {
      // SVM gate resolved it
      nodeStates['svm_gate'] = 'pp-resolved';
      branchStates['svm_gate'] = 'pp-lit';
      // Voters, Granite, Bob stay dark; Resolved lights
      nodeStates['resolved'] = 'pp-resolved';
      // vline from svm→voters: not traversed
    } else if (resolvedBy === 'voter_agreement') {
      // Traversed SVM gate (passed but did not resolve)
      nodeStates['svm_gate'] = 'pp-traversed';
      vlineStates[2] = 'pp-traversed'; // SVM gate → Voters line
      nodeStates['voters'] = 'pp-resolved';
      branchStates['voters'] = 'pp-lit';
      nodeStates['resolved'] = 'pp-resolved';
    } else if (resolvedBy === 'escalate') {
      // Traversed SVM gate and Voters; Granite tiebreak lit; Bob lights
      nodeStates['svm_gate'] = 'pp-traversed';
      vlineStates[2] = 'pp-traversed';
      nodeStates['voters'] = 'pp-traversed';
      vlineStates[3] = 'pp-traversed';
      nodeStates['granite'] = 'pp-lit';
      vlineStates[4] = 'pp-lit';
      if (escalationSettled) {
        nodeStates['bob'] = 'pp-escalated';
      } else {
        nodeStates['bob'] = 'pp-escalating';
      }
      // Resolved: only lights if report is settled
      if (escalationSettled && verdict) {
        vlineStates[5] = verdict === 'fix_failed' ? 'pp-amber' : 'pp-lit';
        if (verdict === 'fix_verified') {
          nodeStates['resolved'] = 'pp-resolved';
        } else if (verdict === 'fix_failed') {
          nodeStates['resolved'] = 'pp-resolved-failed';
        } else {
          // needs_human
          nodeStates['resolved'] = 'pp-resolved-human';
        }
      } else {
        // Resolved stays dark until verdict arrives
        nodeStates['resolved'] = 'pp-dark';
      }
    }
  }

  // Build the DOM
  PIPELINE_NODES.forEach((node, i) => {
    // Vertical connector before this node (except first)
    if (i > 0) {
      const vline = document.createElement('div');
      vline.className = 'pp-vline' + (vlineStates[i] ? ' ' + vlineStates[i] : '');
      spine.appendChild(vline);
    }

    // Step row: [pill] [branch-line + route-pill] if hasBranch
    const step = document.createElement('div');
    step.className = 'pipeline-step';

    const pill = document.createElement('div');
    pill.id = 'ppn-' + node.id;
    pill.className = 'pp-node ' + (nodeStates[node.id] || 'pp-dark');
    pill.textContent = node.label;
    step.appendChild(pill);

    if (node.hasBranch) {
      const bline = document.createElement('div');
      const bstate = branchStates[node.id] || '';
      bline.className = 'pp-branch-line' + (bstate ? ' ' + bstate : '');
      step.appendChild(bline);

      const route = document.createElement('div');
      route.id = 'ppr-' + node.id;
      route.className = 'pp-route' + (bstate ? ' ' + bstate : '');
      route.textContent = 'route';
      step.appendChild(route);
    }

    spine.appendChild(step);
  });
}

// ── Voters table ──────────────────────────────────────────────────────────────
function buildVoters(voters) {
  const tbody = document.getElementById('voters-tbody');
  tbody.innerHTML = '';
  voters.forEach(v => {
    const pct = Math.round(v.confidence * 100);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${esc(v.voter)}</td>
      <td>${esc(v.domain)}</td>
      <td>
        <div class="conf-bar-wrap">
          <div class="conf-bar"><div class="conf-bar-fill" style="width:${pct}%"></div></div>
          <span class="conf-val">${pct}%</span>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

// ── Evidence chips ────────────────────────────────────────────────────────────
function buildEvidence(evidence) {
  const row = document.getElementById('evidence-chips');
  row.innerHTML = '';
  if (!evidence || evidence.length === 0) {
    row.textContent = 'No evidence terms matched.';
    return;
  }
  evidence.forEach(term => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = term;
    row.appendChild(chip);
  });
}

// ── Escalation panel ─────────────────────────────────────────────────────────
async function loadEscalation(ticketId, resolvedBy) {
  const card = document.getElementById('escalation-card');
  const inner = document.getElementById('escalation-inner');
  card.classList.remove('hidden');

  try {
    const resp = await fetch(`/api/escalations/${encodeURIComponent(ticketId)}`);
    if (resp.status === 404) {
      inner.innerHTML = '<span class="mute">Investigation pending — no report filed yet.</span>';
      return;
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const r = await resp.json();

    // Settle the pipeline amber pulse now that the report has loaded
    buildPipeline(resolvedBy, true, true, r.verdict);

    const verdictClass = { fix_verified: 'fix-verified', fix_failed: 'fix-failed', needs_human: 'needs-human' }[r.verdict] || 'needs-human';
    const verdictLabel = { fix_verified: '✓ FIX VERIFIED', fix_failed: '✗ FIX FAILED', needs_human: '⚠ NEEDS HUMAN' }[r.verdict] || r.verdict;

    const riskLevel = (r.risk_level || 'low').toLowerCase();
    const isHighRisk = riskLevel === 'high';
    const riskBadgeClass = isHighRisk ? 'risk-badge risk-high' : 'risk-badge risk-low';
    const riskBadgeLabel = isHighRisk ? 'HIGH RISK' : 'LOW RISK';
    const riskSubLabel = isHighRisk
      ? 'human approval required'
      : (r.auto_applied ? 'auto-applied' : 'eligible for auto-apply');

    inner.innerHTML = `
      <div class="mt-8 verdict-risk-row" style="margin-bottom:16px">
        <span class="verdict-badge ${verdictClass}">${verdictLabel}</span>
        <span class="${riskBadgeClass}">
          ${riskBadgeLabel}
          <span class="risk-sub">${riskSubLabel}</span>
        </span>
      </div>

      <div class="card-title mt-16">Root Cause</div>
      <p style="margin-bottom:16px;color:var(--mute)">${esc(r.root_cause)}</p>

      <div class="card-title">Patch Summary</div>
      <p style="margin-bottom:16px;color:var(--mute)">${esc(r.patch_summary)}</p>

      <div class="card-title">Files Examined</div>
      <div class="chip-row" style="margin-bottom:16px">
        ${r.files_examined.map(f => `<span class="chip">${esc(f)}</span>`).join('')}
      </div>

      <div class="card-title">Diff</div>
      <pre id="diff-block" style="margin-bottom:16px"></pre>

      <div class="card-title">Test Results</div>
      <div class="tests-grid">
        <div class="tests-block"><label>Before</label><code>${esc(r.tests_before)}</code></div>
        <div class="tests-block"><label>After</label><code>${esc(r.tests_after)}</code></div>
      </div>
    `;
    renderDiff(document.getElementById('diff-block'), r.diff);
  } catch (e) {
    inner.innerHTML = `<span style="color:var(--red)">Error loading report: ${esc(String(e))}</span>`;
  }
}

// ── Form submit ───────────────────────────────────────────────────────────────
document.getElementById('ticket-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const id    = document.getElementById('ticket-id').value.trim();
  const title = document.getElementById('ticket-title').value.trim();
  const desc  = document.getElementById('ticket-desc').value.trim();

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Routing…';

  // Reset result area
  document.getElementById('result-area').classList.add('hidden');
  document.getElementById('escalation-card').classList.add('hidden');

  try {
    const resp = await fetch('/api/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, title, description: desc }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      throw new Error(err.detail || resp.statusText);
    }
    const data = await resp.json();

    // Show result area
    document.getElementById('result-area').classList.remove('hidden');

    const isEscalated = data.domain === 'escalated';

    // Build pipeline — escalating pulse until report loads
    buildPipeline(data.resolved_by, isEscalated, false, null);

    // Voters
    buildVoters(data.voters);

    // Evidence
    buildEvidence(data.evidence);

    // Elapsed
    document.getElementById('elapsed-row').textContent = `Elapsed: ${data.elapsed_ms} ms`;

    // Escalation panel: show with looping amber, then settle once report lands
    if (isEscalated) {
      loadEscalation(data.ticket_id, data.resolved_by);
    }

  } catch (err) {
    document.getElementById('result-area').classList.remove('hidden');
    // Show error in the pipeline card area
    document.getElementById('pipeline-card').innerHTML =
      `<div class="pipeline-title" style="color:var(--red)">Error</div><p style="color:var(--red);margin-top:8px;font-size:12px">${esc(String(err))}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Route Ticket';
  }
});
</script>
</body>
</html>
