<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SentinelDesk — Live Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f14;--panel:#111821;--panel2:#0e141b;--line:#1e2a36;--ink:#e6edf3;
    --mute:#8a9aaa;--dim:#55677a;--signal:#3ddc84;--amber:#ffb454;--red:#ff5d5d;--blue:#5db4ff;--violet:#b48cff;
    --mono:'JetBrains Mono',monospace;--display:'Fraunces',serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;
    background-image:radial-gradient(circle at 50% -10%,rgba(61,220,132,.06),transparent 45%);}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-family:var(--display);font-size:24px;font-weight:900;letter-spacing:-.02em}
  header h1 em{color:var(--signal);font-style:italic}
  header .sub{color:var(--mute);font-size:12px}
  .controls{margin-left:auto;display:flex;gap:10px;align-items:center}
  .toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .toggle button{background:var(--panel);color:var(--mute);border:none;padding:8px 14px;font-family:var(--mono);font-size:12px;cursor:pointer}
  .toggle button.on{background:var(--signal);color:#063}
  .run{background:var(--signal);color:#063;border:none;border-radius:8px;padding:9px 18px;font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer}
  .run:hover{filter:brightness(1.1)} .run:disabled{opacity:.5;cursor:default}

  .stage{max-width:980px;margin:0 auto;padding:28px 24px 80px}
  .ticketbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:8px}
  .ticketbar .lbl{font-size:10px;letter-spacing:.25em;color:var(--signal);text-transform:uppercase}
  .ticketbar input{width:100%;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:14px;margin-top:6px;outline:none}

  /* accuracy meter */
  .meter{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .meter .row{display:flex;align-items:baseline;gap:14px}
  .meter .now{font-family:var(--display);font-size:42px;font-weight:900;color:var(--signal);transition:.5s}
  .meter .tag{font-size:11px;color:var(--dim);letter-spacing:.1em}
  .bar{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--signal));transition:width .6s ease}

  .step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:12px;
    opacity:.32;transform:translateY(6px);transition:.45s;overflow:hidden}
  .step.in{opacity:1;transform:none}
  .step.active{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal),0 0 34px rgba(61,220,132,.28);transform:translateY(-2px) scale(1.005)}
  .step.done{opacity:.62}
  .step .head{display:flex;align-items:center;gap:14px;padding:15px 18px;cursor:pointer}
  .step .ico{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:14px;
    background:var(--panel2);border:1px solid var(--line);color:var(--signal)}
  .step.active .ico{background:var(--signal);color:#063;border-color:var(--signal)}
  .step .ttl{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink)}
  .step .sent{font-size:12.5px;color:var(--mute);margin-top:2px}
  .step .chev{margin-left:auto;color:var(--dim);font-size:11px;transition:.3s}
  .step.open .chev{transform:rotate(90deg)}
  .step .detail{max-height:0;overflow:hidden;transition:max-height .4s ease;border-top:1px solid transparent}
  .step.open .detail{max-height:600px;border-top-color:var(--line)}
  .step .detail .inner{padding:14px 18px;font-size:11.5px;color:var(--mute);background:#070b0f}
  .step .detail pre{white-space:pre-wrap;color:var(--mute);font-size:11px;line-height:1.5}
  .k{color:var(--blue)} .g{color:var(--signal)} .a{color:var(--amber)} .r{color:var(--red)}

  /* per-kind accents */
  .step[data-k="accept"]{border-left:3px solid var(--signal)}
  .step[data-k="reject"]{border-left:3px solid var(--dim)}
  .step[data-k="sealed"]{border-left:3px solid var(--blue)}
  .step[data-k="safety"]{border-left:3px solid var(--amber)}
  .step[data-k="prompt_try"],.step[data-k="prompt_best"]{border-left:3px solid var(--violet)}

  .status{max-width:980px;margin:0 auto;padding:0 24px;color:var(--dim);font-size:12px}
  .badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute);margin-left:8px}
  .badge.live{color:var(--signal);border-color:#1f6b45} .badge.cached{color:var(--blue);border-color:#234}
</style>
</head>
<body>
<header>
  <h1>Sentinel<em>Desk</em></h1>
  <span class="sub">Live Learning — watch it classify, explain, and improve on held-out data</span>
  <div class="controls">
    <div class="toggle"><button id="mLive" class="on" onclick="setMode('live')">Live</button><button id="mCached" onclick="setMode('cached')">Cached</button></div>
    <a href="/" style="font-size:11px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px">Console</a>
    <a href="/explain" style="font-size:11px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px">Explain</a>
    <a href="/hybrid" style="font-size:11px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px">Hybrid</a>
    <a href="/vocab" style="font-size:11px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px">Vocabulary</a>
    <a href="/datagen" style="font-size:11px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px">Data Gen</a>
    <label style="font-size:11px;color:var(--mute)"><input type="checkbox" id="pp"> prompt search</label>
    <button class="run" id="go" onclick="start()">▶ Run</button>
  </div>
</header>

<div class="status" id="status"></div>

<div class="stage">
  <div class="ticketbar">
    <div class="lbl">Ticket</div>
    <input id="ticket" value="websites won't load — users across the office cannot reach internal sites">
  </div>

  <div class="meter">
    <div class="row"><span class="now" id="acc">—</span><span class="tag" id="accTag">held-out accuracy</span></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div id="steps"></div>
</div>

<script>
const API=location.origin, $=id=>document.getElementById(id);
let MODE="live";
function setMode(m){MODE=m;$('mLive').classList.toggle('on',m=='live');$('mCached').classList.toggle('on',m=='cached');}

const ICON={safety:"🛡",normalize:"↻",classify:"◎",explain:"💡",verdict:"✓",split:"◉",baseline:"▦",
  mine:"⛏",accept:"＋",reject:"−",sealed:"🔒",prompt_intro:"✎",prompt_try:"✎",prompt_best:"★",prompt_skip:"⊘",error:"!"};

function detailHTML(s){
  const d=s.detail||{};
  if(s.kind==='explain'&&d.evidence) return `<pre>evidence: ${JSON.stringify(d.evidence,null,1)}</pre>`;
  if(s.kind==='verdict'&&d.chain) return `<pre>${d.chain.map(x=>'· '+x).join('\n')}</pre>`;
  if(s.kind==='normalize') return `<pre><span class="k">before:</span> ${d.before}\n<span class="k">after:</span>  ${d.after}\n<span class="k">changed:</span> ${d.changed}</pre>`;
  if(s.kind==='split') return `<pre>train=${d.train}  validation=${d.val}  <span class="r">test=${d.test} (sealed)</span></pre>`;
  if(s.kind==='mine') return `<pre>candidates: ${(d.candidates||[]).map(c=>c[1]+'→'+c[0]).join(', ')}</pre>`;
  if(s.kind==='accept') return `<pre><span class="g">+ ${d.term} → ${d.category}</span>\nheld-out ${(d.val_before*100).toFixed(1)}% → ${(d.val_after*100).toFixed(1)}%</pre>`;
  if(s.kind==='sealed') return `<pre>baseline test: ${(d.base_test*100).toFixed(1)}%\noptimized test: ${(d.opt_test*100).toFixed(1)}%\nval→test gap: ${(d.gap*100).toFixed(1)}%\n<span class="a">${d.honest}</span></pre>`;
  if((s.kind==='prompt_try'||s.kind==='prompt_best')&&d.prompt) return `<pre>${(d.prompt||'').replace(/</g,'&lt;')}</pre>`;
  return Object.keys(d).length?`<pre>${JSON.stringify(d,null,1).replace(/</g,'&lt;')}</pre>`:'<pre>(no extra detail)</pre>';
}

let timer=null;
function render(run){
  clearInterval(timer);
  const box=$('steps'); box.innerHTML='';
  $('status').innerHTML=`${run.steps.length} steps <span class="badge ${run.mode}">${run.mode.toUpperCase()}</span>${run.captured_at?'<span class="badge">'+run.captured_at+'</span>':''}`;
  const els=run.steps.map(s=>{
    const el=document.createElement('div'); el.className='step'; el.dataset.k=s.kind;
    el.innerHTML=`<div class="head"><div class="ico">${ICON[s.kind]||'•'}</div>
      <div><div class="ttl">${s.title}</div><div class="sent">${s.sentence}</div></div>
      <div class="chev">▶</div></div><div class="detail"><div class="inner">${detailHTML(s)}</div></div>`;
    el.querySelector('.head').onclick=()=>el.classList.toggle('open');
    box.appendChild(el); return el;
  });
  // auto-play: reveal + glow one by one
  let i=0;
  const advance=()=>{
    if(i>0){els[i-1].classList.remove('active');els[i-1].classList.add('done');}
    if(i>=els.length){clearInterval(timer);return;}
    const el=els[i], s=run.steps[i];
    el.classList.add('in','active');
    el.scrollIntoView({behavior:'smooth',block:'center'});
    if(s.metric){ const v=s.metric.val??s.metric.test;
      if(v!=null){$('acc').textContent=v.toFixed(1)+'%';$('bar').style.width=v+'%';
        $('accTag').textContent=(s.metric.test!=null?'sealed test accuracy':'held-out validation accuracy');}}
    i++;
  };
  advance(); timer=setInterval(advance, MODE==='cached'?900:700);
}

function start(){
  $('go').disabled=true; $('acc').textContent='…'; $('bar').style.width='0';
  const done=()=>{$('go').disabled=false;};
  if(MODE==='cached'){
    fetch(API+'/api/learn/cached').then(r=>r.json()).then(run=>{render(run);done();}).catch(e=>{$('status').textContent='error: '+e;done();});
  } else {
    const body={title:$('ticket').value, description:"", prompt_search:$('pp').checked, capture:false};
    $('status').textContent='running live… (held-out evaluation; may take a few seconds)';
    fetch(API+'/api/learn/live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(r=>r.json()).then(run=>{render(run);done();}).catch(e=>{$('status').textContent='error: '+e;done();});
  }
}
// connection hint
fetch(API+'/api/tickets').then(r=>r.json()).then(()=>{$('status').textContent='ready — choose Live or Cached, then Run';})
  .catch(()=>{$('status').innerHTML='<span style="color:var(--red)">backend not running</span> — start: python web/server.py';});
</script>
</body>
</html>
