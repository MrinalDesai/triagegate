<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SentinelDesk — Audit Log</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f14;--panel:#111821;--panel2:#0e141b;--line:#1e2a36;--ink:#e6edf3;
    --mute:#8a9aaa;--dim:#55677a;--signal:#3ddc84;--amber:#ffb454;--red:#ff5d5d;--blue:#5db4ff;
    --mono:'JetBrains Mono',monospace;--display:'Fraunces',serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;
    background-image:radial-gradient(circle at 50% -8%,rgba(93,180,255,.06),transparent 45%);}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-family:var(--display);font-size:24px;font-weight:900;letter-spacing:-.02em}
  header h1 em{color:var(--signal);font-style:italic}
  header .sub{color:var(--mute);font-size:12px}
  .tabs{margin-left:auto;display:flex;gap:8px}
  .tabs a{font-size:11px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px}
  .tabs a:hover{border-color:var(--signal);color:var(--signal)}
  .run{background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-family:var(--mono);font-size:11px;cursor:pointer;margin-left:8px}
  .run:hover{border-color:var(--signal);color:var(--signal)}
  .stage{max-width:1180px;margin:0 auto;padding:24px}
  .meta{color:var(--dim);font-size:12px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--signal);font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--mute);vertical-align:top}
  tr:hover td{background:var(--panel2)}
  .ts{color:var(--dim);white-space:nowrap;font-size:11px}
  .tk{color:var(--ink);max-width:280px}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--line)}
  .b-pass{color:var(--mute)} .b-esc{color:var(--amber);border-color:#443}
  .out-auto_resolved{color:var(--signal)} .out-escalated{color:var(--amber)} .out-safety_escalated{color:var(--red)}
  .conf{font-weight:700;color:var(--ink)}
  .empty{color:var(--dim);padding:30px;text-align:center}
  .status{max-width:1180px;margin:0 auto;padding:0 28px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Sentinel<em>Desk</em></h1>
  <span class="sub">Audit Log — every routing decision, recorded</span>
  <div class="tabs">
    <a href="/">Console</a><a href="/explain">Explain</a><a href="/hybrid">Hybrid</a><a href="/vocab">Vocabulary</a><a href="/synonyms">Synonyms</a><a href="/learn">Live Learning</a><a href="/correct">Self-Correct</a><a href="/datagen">Data Gen</a><a href="/external">External</a>
    <button class="run" onclick="load()">↻ refresh</button>
  </div>
</header>
<div class="status" id="status">loading…</div>

<div class="stage">
  <div class="meta" id="meta"></div>
  <table>
    <thead><tr>
      <th>Timestamp</th><th>Ticket</th><th>Safety</th><th>Classifier</th><th>Router</th><th>Resolver</th><th>Outcome</th><th>Conf.</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No audit entries yet. Run a ticket in the <a href="/" style="color:var(--signal)">Console</a> and refresh.</div>
</div>

<script>
const API=location.origin, $=id=>document.getElementById(id);
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function load(){
  $('status').textContent='loading…';
  fetch(API+'/api/audit').then(r=>r.json()).then(d=>{
    $('status').textContent='';
    $('meta').textContent=`${d.count} decisions logged (most recent first) · source: logs/audit.jsonl`;
    const tb=$('rows'); tb.innerHTML='';
    if(!d.rows.length){ $('empty').style.display='block'; return; }
    $('empty').style.display='none';
    d.rows.forEach(r=>{
      const safe = r.safety && r.safety.startsWith('ESCALATED')
        ? `<span class="badge b-esc">${esc(r.safety)}</span>` : `<span class="badge b-pass">pass</span>`;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td class="ts">${esc(r.ts)}</td>
        <td class="tk">${esc(r.ticket)}</td>
        <td>${safe}</td>
        <td>${esc(r.classifier)}</td>
        <td>${esc(r.router)}</td>
        <td>${esc(r.resolver)}</td>
        <td class="out-${esc(r.outcome)}">${esc(r.outcome)}</td>
        <td class="conf">${r.confidence!=null?Math.round(r.confidence*100)+'%':'—'}</td>`;
      tb.appendChild(tr);
    });
  }).catch(()=>{$('status').innerHTML='<span style="color:var(--red)">backend not running</span>';});
}
load();
</script>
</body>
</html>
