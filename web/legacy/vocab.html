<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SentinelDesk — Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f14;--panel:#111821;--panel2:#0e141b;--line:#1e2a36;--ink:#e6edf3;
    --mute:#8a9aaa;--dim:#55677a;--signal:#3ddc84;--amber:#ffb454;--blue:#5db4ff;--violet:#b48cff;
    --mono:'JetBrains Mono',monospace;--display:'Fraunces',serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;
    background-image:radial-gradient(circle at 50% -8%,rgba(180,140,255,.06),transparent 45%);}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-family:var(--display);font-size:24px;font-weight:900;letter-spacing:-.02em}
  header h1 em{color:var(--signal);font-style:italic}
  header .sub{color:var(--mute);font-size:12px}
  .controls{margin-left:auto;display:flex;gap:10px;align-items:center}
  .tabs a{font-size:11px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px}
  .tabs a:hover{border-color:var(--signal);color:var(--signal)}
  .stage{max-width:1080px;margin:0 auto;padding:24px}
  .searchbar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
  .searchbar input{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:8px;outline:none}
  .searchbar input:focus{border-color:var(--signal)}
  .chipfilter{display:flex;gap:6px;flex-wrap:wrap}
  .chipfilter button{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:14px;padding:5px 11px;font-size:11px;cursor:pointer}
  .chipfilter button.on{border-color:var(--signal);color:var(--signal)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .dom{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;border-top:3px solid var(--violet)}
  .dom h3{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:3px}
  .dom .cnt{font-size:10.5px;color:var(--dim);margin-bottom:10px}
  .sec{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--signal);margin:10px 0 6px}
  .sec.ng{color:var(--blue)} .sec.fr{color:var(--amber)}
  .term{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:2px;font-size:11px;color:var(--mute)}
  .term.ng{border-color:#234;color:var(--blue)} .term.uq{border-color:#1f6b45;color:var(--signal)} .term.fr{border-color:#443;color:var(--amber)}
  .term.hit{background:var(--signal);color:#063;border-color:var(--signal)}
  .status{max-width:1080px;margin:0 auto;padding:0 28px;color:var(--dim);font-size:12px}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--signal);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>Sentinel<em>Desk</em></h1>
  <span class="sub">Vocabulary — the terms each domain is recognized by</span>
  <div class="controls"><div class="tabs"><a href="/">Console</a><a href="/explain">Explain</a><a href="/hybrid">Hybrid</a><a href="/learn">Live Learning</a><a href="/correct">Self-Correct</a><a href="/datagen">Data Gen</a><a href="/external">External</a><a href="/synonyms">Synonyms</a></div></div>
</header>
<div class="status" id="status">loading vocabulary…</div>

<div class="stage">
  <div class="searchbar">
    <input id="q" placeholder="search a term across all domains… (e.g. dns, deadlock, vpn)" oninput="apply()">
    <div class="chipfilter">
      <button class="on" data-f="all" onclick="setF('all')">all</button>
      <button data-f="uq" onclick="setF('uq')">unique (TF-IDF)</button>
      <button data-f="ng" onclick="setF('ng')">n-grams</button>
      <button data-f="fr" onclick="setF('fr')">frequent</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const API=location.origin, $=id=>document.getElementById(id);
let DATA={}, FILTER='all';
function setF(f){FILTER=f;document.querySelectorAll('.chipfilter button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));apply();}

fetch(API+'/api/vocab').then(r=>r.json()).then(d=>{DATA=d;$('status').textContent='';render();})
  .catch(()=>{$('status').innerHTML='<span style="color:#ff5d5d">backend not running — python web/server.py</span>';});

function termClass(term, dom){
  const isNg=term.includes(' ');
  const inUniq=DATA[dom].unique.includes(term);
  if(isNg) return 'ng';
  if(inUniq) return 'uq';
  return 'fr';
}

function render(){
  const q=($('q').value||'').toLowerCase().trim();
  const grid=$('grid'); grid.innerHTML='';
  for(const [dom,v] of Object.entries(DATA)){
    // choose term set by filter
    let terms;
    if(FILTER==='ng') terms=v.ngrams;
    else if(FILTER==='uq') terms=v.unique.filter(t=>!t.includes(' '));
    else if(FILTER==='fr') terms=v.frequent;
    else terms=[...new Set([...v.unique, ...v.frequent])].sort();
    if(q) terms=terms.filter(t=>t.includes(q));
    if(!terms.length) continue;
    const card=document.createElement('div'); card.className='dom';
    card.innerHTML=`<h3>${dom}</h3><div class="cnt">${v.counts.unique} unique · ${v.counts.ngrams} n-grams · ${v.counts.frequent} frequent</div>`;
    const wrap=document.createElement('div');
    terms.forEach(t=>{ const s=document.createElement('span');
      let cls=termClass(t,dom); s.className='term '+cls+(q&&t.includes(q)?' hit':'');
      s.textContent=t; wrap.appendChild(s); });
    card.appendChild(wrap); grid.appendChild(card);
  }
  if(!grid.children.length) grid.innerHTML='<div class="status">no terms match “'+q+'”</div>';
}
function apply(){render();}
</script>
</body>
</html>
